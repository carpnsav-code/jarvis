<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis — computer control</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem; color: #222; }
      input { width: 60%; padding: .5rem; font-size: 1rem; }
      button { padding: .5rem .9rem; font-size: 1rem; }
      pre { background: #f4f4f4; padding: .75rem; border-radius: 6px; white-space: pre-wrap; }
      .hint { color: #666; }
    </style>
  </head>
  <body>
    <h1>Jarvis computer control</h1>
    <p class="hint">
      A manual harness for the same channel the voice assistant uses. Type what
      you want opened — "browse the web", "open calculator", "new google doc".
    </p>
    <p>
      <input id="target" placeholder="browse the web" autofocus />
      <button id="go">Open</button>
    </p>
    <pre id="out">Ready.</pre>

    <script>
      const out = document.getElementById('out');
      const target = document.getElementById('target');
      async function run() {
        const result = await window.jarvis.runCommand({
          action: 'open app',
          target: target.value,
        });
        out.textContent = JSON.stringify(result, null, 2);
      }
      document.getElementById('go').addEventListener('click', run);
      target.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') run();
      });
    </script>
  </body>
</html>
