<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis — assistant interface</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 1.5rem; color: #1a1a1a; }
      h1 { font-size: 1.25rem; }
      .player { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
      .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .bar { max-width: 800px; margin: 1rem 0 .5rem; display: flex; gap: .5rem; }
      input { flex: 1; padding: .55rem; font-size: 1rem; }
      button { padding: .55rem 1rem; font-size: 1rem; }
      pre { max-width: 800px; background: #f4f4f4; padding: .75rem; border-radius: 6px; white-space: pre-wrap; }
      .hint { color: #666; max-width: 800px; }
      .nowplaying { max-width: 800px; margin: 1rem 0 0; padding: .6rem .9rem; background: #1db954; color: #fff; border-radius: 6px; font-weight: 600; }
      /* Ambient pulse on the input bar while actively listening. */
      .bar.listening input { box-shadow: 0 0 0 0 rgba(29, 185, 84, .6); animation: pulse 1.6s infinite; }
      @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(29, 185, 84, .5); }
        70%  { box-shadow: 0 0 0 10px rgba(29, 185, 84, 0); }
        100% { box-shadow: 0 0 0 0 rgba(29, 185, 84, 0); }
      }
    </style>
  </head>
  <body>
    <h1>Jarvis assistant interface</h1>
    <div class="player">
      <!-- src is set at runtime by the main process via player:load -->
      <iframe
        id="player"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>

    <div id="nowplaying" class="nowplaying" hidden></div>

    <div class="bar">
      <input
        id="utterance"
        placeholder="Speak, or type: play blinding lights by the weeknd · what's the weather · open calculator"
        autofocus
      />
      <button id="go">Send</button>
      <button id="mic-toggle">🎤 Mic on</button>
      <button id="speaker-toggle">🔊 Speaker on</button>
      <button id="spotify-auth">Connect Spotify</button>
    </div>
    <p class="hint">
      Always listening — just talk. Or type. Ask a question ("what's the weather
      in Paris"), give a command ("open calculator", "play a video about lofi"),
      or control music ("play blinding lights by the weeknd", "next", "volume up").
    </p>
    <pre id="out">Ready.</pre>

    <script src="renderer.js"></script>
  </body>
</html>
