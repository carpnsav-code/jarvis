<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J.A.R.V.I.S.</title>
    <style>
      :root {
        /* Red + black theme (var names kept as --cyan* to avoid churn). */
        --cyan: #ff2b2b;
        --cyan-bright: #ff8a8a;
        --cyan-dim: rgba(255, 43, 43, 0.5);
        --amber: #ff9a4d;
        --bg: #0a0304;
        --panel: rgba(30, 6, 8, 0.45);
        --panel-brd: rgba(255, 43, 43, 0.30);
        --text: #ffd6d6;
        --text-dim: #a06a6a;
        --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
        --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font);
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
        text-shadow: 0 0 12px rgba(255, 43, 43, 0.25);
      }

      /* holographic projection canvas */
      #holo { position: fixed; inset: 0; z-index: 0; }

      /* scanlines + vignette + flicker */
      .fx {
        position: fixed; inset: 0; z-index: 2; pointer-events: none;
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(30, 0, 0, 0.28) 2px 3px),
          radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(0,0,0,0.75) 100%);
        mix-blend-mode: multiply;
        animation: flicker 6s infinite;
      }
      @keyframes flicker { 0%,97%,100% { opacity: 1; } 98% { opacity: 0.82; } 99% { opacity: 0.94; } }

      /* HUD corner brackets */
      .hud { position: fixed; inset: 14px; z-index: 3; pointer-events: none; }
      .hud::before, .hud::after,
      .hud .bl, .hud .br {
        content: ""; position: absolute; width: 46px; height: 46px;
        border: 1px solid var(--cyan-dim);
      }
      .hud::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
      .hud::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
      .hud .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
      .hud .br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

      .app { position: relative; z-index: 5; height: 100vh; display: flex; flex-direction: column; padding: 26px 34px; }

      /* top bar */
      .topbar { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: baseline; gap: 14px; }
      .wordmark { font-size: 22px; font-weight: 700; letter-spacing: 12px; color: var(--cyan-bright);
        text-shadow: 0 0 22px var(--cyan); }
      .subtitle { font: 10px/1 var(--mono); letter-spacing: 4px; color: var(--text-dim); text-transform: uppercase; }
      .status { display: flex; gap: 10px; }
      .chip {
        display: inline-flex; align-items: center; gap: 8px;
        font: 10px/1 var(--mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim);
        padding: 9px 13px; border: 1px solid var(--panel-brd); border-radius: 4px;
        background: var(--panel); backdrop-filter: blur(6px); cursor: pointer; user-select: none;
        transition: color .2s, border-color .2s, box-shadow .2s;
      }
      .chip:hover { color: var(--cyan-bright); border-color: var(--cyan); box-shadow: 0 0 16px var(--cyan-dim); }
      .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
      .chip.off { color: #3a4a5a; } .chip.off .dot { background: #3a4a5a; box-shadow: none; }

      /* main */
      .main { flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: 26px; min-height: 0; margin-top: 10px; }
      .stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4vh; }
      /* The status label + response text over the hologram are hidden — the
         conversation lives only in the transcript panel. */
      .state-label, .response { display: none; }

      /* side HUD panels */
      .side { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
      .panel {
        position: relative; background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 6px;
        padding: 14px 16px; backdrop-filter: blur(10px);
      }
      .panel::before, .panel::after {
        content: ""; position: absolute; width: 12px; height: 12px; border: 1px solid var(--cyan);
      }
      .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
      .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
      .panel h2 { margin: 0 0 10px; font: 10px/1 var(--mono); letter-spacing: 3px; text-transform: uppercase;
        color: var(--cyan); }
      .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; overflow: hidden;
        border: 1px solid var(--panel-brd); }
      .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .nowplaying { display: none; align-items: center; gap: 8px; font-weight: 600; color: var(--cyan-bright); font-size: 14px; }
      .nowplaying[data-on="1"] { display: flex; }
      .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; min-height: 0; }
      .log .entry { font-size: 13px; line-height: 1.45; }
      .log .you { color: var(--text-dim); } .log .jarvis { color: var(--cyan-bright); }
      .log b { font: 9px/1 var(--mono); letter-spacing: 2px; text-transform: uppercase; margin-right: 8px; opacity: .7; }

      /* command bar */
      .bar { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
      .bar input {
        flex: 1; padding: 15px 18px; font-size: 15px; color: var(--cyan-bright); font-family: var(--font);
        background: rgba(4, 14, 26, 0.6); border: 1px solid var(--panel-brd); border-radius: 5px; outline: none;
        transition: border-color .2s, box-shadow .2s;
      }
      .bar input::placeholder { color: #3f5a70; }
      .bar input:focus { border-color: var(--cyan); box-shadow: 0 0 20px var(--cyan-dim); }
      .bar.listening input { border-color: var(--cyan); animation: pulseBar 1.5s infinite; }
      @keyframes pulseBar {
        0% { box-shadow: 0 0 0 0 rgba(255,43,43,.45); } 70% { box-shadow: 0 0 0 14px rgba(255,43,43,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,43,43,0); }
      }
      .btn { padding: 14px 18px; font-size: 14px; font-family: var(--mono); letter-spacing: 1px; color: var(--cyan);
        background: var(--panel); border: 1px solid var(--cyan-dim); border-radius: 5px; cursor: pointer;
        text-transform: uppercase; transition: color .2s, box-shadow .2s, background .2s; }
      .btn:hover { color: var(--bg); background: var(--cyan); box-shadow: 0 0 22px var(--cyan); }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 6px; }
      @media (max-width: 900px) { .main { grid-template-columns: 1fr; } .side { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="holo"></canvas>
    <div class="fx"></div>
    <div class="hud"><span class="bl"></span><span class="br"></span></div>

    <div class="app">
      <div class="topbar">
        <div class="brand">
          <div class="wordmark">J.A.R.V.I.S.</div>
          <div class="subtitle">Just A Rather Very Intelligent System</div>
        </div>
        <div class="status">
          <span class="chip" id="conn"><span class="dot"></span> Online</span>
          <span class="chip" id="mic-toggle"><span class="dot"></span> Mic on</span>
          <span class="chip" id="speaker-toggle"><span class="dot"></span> Speaker on</span>
          <span class="chip" id="spotify-auth">Connect Spotify</span>
        </div>
      </div>

      <div class="main">
        <div class="stage" id="stage" data-state="idle">
          <div class="state-label" id="state-label">Standby</div>
          <div class="response" id="out">Initializing…</div>
        </div>
        <div class="side">
          <div class="panel">
            <h2>Now Playing</h2>
            <div class="nowplaying" id="nowplaying"></div>
            <div class="player" style="margin-top:10px">
              <iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>
          <div class="panel" style="flex:1; display:flex; flex-direction:column; min-height:0;">
            <h2>Transcript</h2>
            <div class="log" id="log"></div>
          </div>
        </div>
      </div>

      <div class="bar">
        <input id="utterance" placeholder="Speak, or type — “what's the weather”  ·  “open calculator”  ·  “play blinding lights by the weeknd”" autofocus />
        <button class="btn" id="go">Send</button>
      </div>
    </div>

    <script>
      // Holographic core: rotating rings + a state-reactive projected waveform.
      (function () {
        const canvas = document.getElementById('holo');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        let W, H, cx, cy, R;
        function resize() {
          W = canvas.width = innerWidth * devicePixelRatio;
          H = canvas.height = innerHeight * devicePixelRatio;
          canvas.style.width = innerWidth + 'px';
          canvas.style.height = innerHeight + 'px';
          cx = W * 0.42; cy = H * 0.44; R = Math.min(W, H) * 0.17;
        }
        addEventListener('resize', resize); resize();

        const particles = Array.from({ length: 60 }, () => ({
          a: Math.random() * Math.PI * 2, r: R * (0.4 + Math.random() * 1.4),
          s: 0.2 + Math.random() * 0.8, z: Math.random(),
        }));

        function stateAmp(state, t) {
          if (state === 'speaking') return 1.0 + Math.sin(t * 9) * 0.5 + Math.sin(t * 17) * 0.25;
          if (state === 'listening') return 0.5 + Math.sin(t * 3) * 0.28;
          if (state === 'thinking') return 0.7 + (Math.random() - 0.5) * 0.9;
          return 0.32 + Math.sin(t * 1.4) * 0.14; // idle breathing
        }
        function color(state) {
          return state === 'thinking' ? [255, 154, 77] : [255, 43, 43];
        }

        let t = 0;
        function frame() {
          t += 0.016;
          const state = stage.dataset.state || 'idle';
          const [cr, cg, cb] = color(state);
          const amp = stateAmp(state, t);
          ctx.clearRect(0, 0, W, H);

          // projection base glow
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 3.2);
          g.addColorStop(0, `rgba(${cr},${cg},${cb},0.10)`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.lineCap = 'round';

          // rotating dashed rings
          for (let i = 0; i < 4; i++) {
            const rr = R * (0.9 + i * 0.28);
            ctx.save();
            ctx.rotate(t * (i % 2 ? -0.4 : 0.55) + i);
            ctx.strokeStyle = `rgba(${cr},${cg},${cb},${0.35 - i * 0.06})`;
            ctx.lineWidth = 1.5 * devicePixelRatio;
            ctx.setLineDash([R * 0.5, R * (0.3 + i * 0.2)]);
            ctx.shadowBlur = 18; ctx.shadowColor = `rgba(${cr},${cg},${cb},0.8)`;
            ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
          }

          // reactive waveform ring
          ctx.beginPath();
          const N = 160;
          for (let k = 0; k <= N; k++) {
            const ang = (k / N) * Math.PI * 2;
            const wob = Math.sin(ang * 6 + t * 4) + Math.sin(ang * 11 - t * 6) * 0.5;
            const rr = R * (0.72 + 0.10 * amp * wob);
            const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
            k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.strokeStyle = `rgba(${cr},${cg},${cb},0.9)`;
          ctx.lineWidth = 2 * devicePixelRatio;
          ctx.shadowBlur = 26; ctx.shadowColor = `rgba(${cr},${cg},${cb},1)`;
          ctx.setLineDash([]); ctx.stroke();

          // core sphere
          const cores = R * (0.34 + 0.05 * amp);
          const cg2 = ctx.createRadialGradient(-cores * 0.3, -cores * 0.3, 0, 0, 0, cores);
          cg2.addColorStop(0, `rgba(${cr + 120 > 255 ? 255 : cr + 120},255,255,0.95)`);
          cg2.addColorStop(0.5, `rgba(${cr},${cg},${cb},0.8)`);
          cg2.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
          ctx.fillStyle = cg2; ctx.shadowBlur = 40; ctx.shadowColor = `rgba(${cr},${cg},${cb},1)`;
          ctx.beginPath(); ctx.arc(0, 0, cores, 0, Math.PI * 2); ctx.fill();

          // floating hologram particles
          ctx.shadowBlur = 8;
          for (const p of particles) {
            p.a += 0.002 * p.s; p.z += 0.003 * p.s; if (p.z > 1) p.z = 0;
            const rr = p.r * (0.8 + p.z * 0.5);
            const x = Math.cos(p.a) * rr, y = Math.sin(p.a) * rr - p.z * R;
            ctx.fillStyle = `rgba(${cr},${cg},${cb},${(1 - p.z) * 0.5})`;
            ctx.beginPath(); ctx.arc(x, y, 1.4 * devicePixelRatio, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
          requestAnimationFrame(frame);
        }
        frame();
      })();
    </script>
    <script src="renderer.js"></script>
  </body>
</html>
