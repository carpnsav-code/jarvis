<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --bg-2: #0d1424;
        --panel: rgba(18, 27, 48, 0.55);
        --panel-brd: rgba(74, 128, 180, 0.28);
        --cyan: #22d3ee;
        --cyan-dim: rgba(34, 211, 238, 0.55);
        --text: #dce7f5;
        --text-dim: #7d8db0;
        --green: #1db954;
        --danger: #ff5c72;
        --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(1200px 700px at 50% -10%, #14203a 0%, transparent 60%),
          radial-gradient(900px 600px at 90% 110%, #10182c 0%, transparent 55%),
          var(--bg);
        overflow: hidden;
      }
      /* faint grid */
      body::before {
        content: "";
        position: fixed; inset: 0;
        background-image:
          linear-gradient(rgba(74, 128, 180, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(74, 128, 180, 0.05) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
        pointer-events: none;
      }

      .app { position: relative; height: 100vh; display: flex; flex-direction: column; padding: 18px 22px 20px; }

      /* --- top bar --- */
      .topbar { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: baseline; gap: 12px; }
      .wordmark { font-size: 22px; font-weight: 700; letter-spacing: 8px; color: #fff; }
      .wordmark b { color: var(--cyan); text-shadow: 0 0 18px var(--cyan-dim); }
      .subtitle { font: 11px/1 var(--mono); letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }

      .status { display: flex; align-items: center; gap: 10px; }
      .chip {
        display: inline-flex; align-items: center; gap: 7px;
        font: 11px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase;
        color: var(--text-dim);
        padding: 8px 12px; border-radius: 999px;
        background: var(--panel); border: 1px solid var(--panel-brd);
        cursor: pointer; user-select: none;
        transition: color .2s, border-color .2s, background .2s;
      }
      .chip:hover { color: var(--text); border-color: var(--cyan-dim); }
      .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
      .chip.off { color: #56617d; }
      .chip.off .dot { background: #56617d; box-shadow: none; }

      /* --- main --- */
      .main { flex: 1; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; min-height: 0; margin-top: 14px; }
      .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; min-height: 0; }

      /* voice orb */
      .orb-wrap { position: relative; width: 260px; height: 260px; display: grid; place-items: center; }
      .ring { position: absolute; border-radius: 50%; border: 1px solid var(--panel-brd); }
      .ring.r1 { width: 100%; height: 100%; animation: spin 22s linear infinite; border-top-color: var(--cyan-dim); }
      .ring.r2 { width: 78%; height: 78%; animation: spin 16s linear infinite reverse; border-left-color: var(--cyan-dim); }
      .ring.r3 { width: 56%; height: 56%; border-color: rgba(74,128,180,0.18); }
      .orb {
        width: 40%; height: 40%; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #7ff0ff 0%, var(--cyan) 40%, #0e7490 100%);
        box-shadow: 0 0 40px var(--cyan-dim), inset 0 0 30px rgba(255,255,255,0.25);
        transition: transform .3s ease, box-shadow .3s ease;
      }
      .state-label { font: 12px/1 var(--mono); letter-spacing: 4px; text-transform: uppercase; color: var(--text-dim); }

      /* orb states */
      .stage[data-state="listening"] .orb { animation: breathe 1.6s ease-in-out infinite; box-shadow: 0 0 60px var(--cyan); }
      .stage[data-state="listening"] .state-label { color: var(--cyan); }
      .stage[data-state="thinking"] .orb { animation: flicker 0.9s ease-in-out infinite; }
      .stage[data-state="thinking"] .ring.r1,
      .stage[data-state="thinking"] .ring.r2 { animation-duration: 3s; border-top-color: var(--cyan); }
      .stage[data-state="thinking"] .state-label { color: #ffd166; }
      .stage[data-state="speaking"] .orb { animation: pulseOrb 0.5s ease-in-out infinite; box-shadow: 0 0 70px var(--cyan); }
      .stage[data-state="speaking"] .state-label { color: var(--cyan); }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @keyframes pulseOrb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
      @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

      .response {
        max-width: 460px; text-align: center; font-size: 18px; line-height: 1.5;
        color: var(--text); min-height: 54px;
      }

      /* right column panels */
      .side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
      .panel {
        background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 14px;
        padding: 14px 16px; backdrop-filter: blur(8px);
      }
      .panel h2 { margin: 0 0 10px; font: 11px/1 var(--mono); letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); font-weight: 600; }
      .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
      .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .nowplaying { display: none; align-items: center; gap: 10px; font-weight: 600; color: #eafff2; }
      .nowplaying::before { content: "♪"; color: var(--green); font-size: 18px; }
      .nowplaying[data-on="1"] { display: flex; }

      .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
      .log .entry { font-size: 13px; line-height: 1.4; }
      .log .you { color: var(--text-dim); }
      .log .you b, .log .jarvis b { font: 10px/1 var(--mono); letter-spacing: 2px; text-transform: uppercase; margin-right: 8px; }
      .log .you b { color: #7d8db0; }
      .log .jarvis b { color: var(--cyan); }

      /* --- command bar --- */
      .bar { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
      .bar input {
        flex: 1; padding: 14px 16px; font-size: 15px; color: var(--text);
        background: rgba(10,16,30,0.7); border: 1px solid var(--panel-brd); border-radius: 12px;
        outline: none; transition: border-color .2s, box-shadow .2s;
      }
      .bar input::placeholder { color: #56617d; }
      .bar input:focus { border-color: var(--cyan-dim); }
      .bar.listening input { border-color: var(--cyan); box-shadow: 0 0 0 0 rgba(34,211,238,.5); animation: pulseBar 1.6s infinite; }
      @keyframes pulseBar {
        0% { box-shadow: 0 0 0 0 rgba(34,211,238,.45); }
        70% { box-shadow: 0 0 0 12px rgba(34,211,238,0); }
        100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
      }
      .btn {
        padding: 13px 16px; font-size: 14px; font-family: var(--font); color: var(--text);
        background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 12px;
        cursor: pointer; transition: border-color .2s, color .2s, background .2s;
      }
      .btn:hover { border-color: var(--cyan-dim); color: #fff; }
      .btn.accent { background: rgba(34,211,238,0.12); border-color: var(--cyan-dim); color: var(--cyan); }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb { background: rgba(74,128,180,0.3); border-radius: 8px; }

      @media (max-width: 820px) {
        .main { grid-template-columns: 1fr; }
        .side { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- top bar -->
      <div class="topbar">
        <div class="brand">
          <div class="wordmark">JAR<b>V</b>IS</div>
          <div class="subtitle">Voice Command Interface</div>
        </div>
        <div class="status">
          <span class="chip" id="conn"><span class="dot"></span> Online</span>
          <span class="chip" id="mic-toggle"><span class="dot"></span> Mic on</span>
          <span class="chip" id="speaker-toggle"><span class="dot"></span> Speaker on</span>
          <span class="chip" id="spotify-auth">Connect Spotify</span>
        </div>
      </div>

      <!-- main -->
      <div class="main">
        <div class="stage" id="stage" data-state="idle">
          <div class="orb-wrap">
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="orb"></div>
          </div>
          <div class="state-label" id="state-label">Standby</div>
          <div class="response" id="out">Initializing…</div>
        </div>

        <div class="side">
          <div class="panel">
            <h2>Now Playing</h2>
            <div class="nowplaying" id="nowplaying"></div>
            <div class="player" style="margin-top:10px">
              <iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>
          <div class="panel" style="flex:1; display:flex; flex-direction:column; min-height:0;">
            <h2>Transcript</h2>
            <div class="log" id="log"></div>
          </div>
        </div>
      </div>

      <!-- command bar -->
      <div class="bar">
        <input id="utterance" placeholder="Speak, or type — “what's the weather in Paris” · “play blinding lights by the weeknd” · “open calculator”" autofocus />
        <button class="btn accent" id="go">Send</button>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
