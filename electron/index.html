<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J.A.R.V.I.S.</title>
    <style>
      :root {
        /* Red + black theme (var names kept as --cyan* to avoid churn). */
        --cyan: #ff2b2b;
        --cyan-bright: #ff8a8a;
        --cyan-dim: rgba(255, 43, 43, 0.5);
        --amber: #ff9a4d;
        --bg: #0a0304;
        --panel: rgba(30, 6, 8, 0.45);
        --panel-brd: rgba(255, 43, 43, 0.30);
        --text: #ffd6d6;
        --text-dim: #a06a6a;
        --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
        --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font);
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
        text-shadow: 0 0 12px rgba(255, 43, 43, 0.25);
      }

      /* holographic projection canvas */
      #holo { position: fixed; inset: 0; z-index: 0; }

      /* scanlines + vignette + flicker */
      .fx {
        position: fixed; inset: 0; z-index: 2; pointer-events: none;
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(30, 0, 0, 0.28) 2px 3px),
          radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(0,0,0,0.75) 100%);
        mix-blend-mode: multiply;
        animation: flicker 6s infinite;
      }
      @keyframes flicker { 0%,97%,100% { opacity: 1; } 98% { opacity: 0.82; } 99% { opacity: 0.94; } }

      /* HUD corner brackets */
      .hud { position: fixed; inset: 14px; z-index: 3; pointer-events: none; }
      .hud::before, .hud::after,
      .hud .bl, .hud .br {
        content: ""; position: absolute; width: 46px; height: 46px;
        border: 1px solid var(--cyan-dim);
      }
      .hud::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
      .hud::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
      .hud .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
      .hud .br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

      .app { position: relative; z-index: 5; height: 100vh; display: flex; flex-direction: column; padding: 26px 34px; }

      /* top bar */
      .topbar { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: baseline; gap: 14px; }
      .wordmark { font-size: 22px; font-weight: 700; letter-spacing: 12px; color: var(--cyan-bright);
        text-shadow: 0 0 22px var(--cyan); }
      .subtitle { font: 10px/1 var(--mono); letter-spacing: 4px; color: var(--text-dim); text-transform: uppercase; }
      .status { display: flex; gap: 10px; }
      .chip {
        display: inline-flex; align-items: center; gap: 8px;
        font: 10px/1 var(--mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim);
        padding: 9px 13px; border: 1px solid var(--panel-brd); border-radius: 4px;
        background: var(--panel); backdrop-filter: blur(6px); cursor: pointer; user-select: none;
        transition: color .2s, border-color .2s, box-shadow .2s;
      }
      .chip:hover { color: var(--cyan-bright); border-color: var(--cyan); box-shadow: 0 0 16px var(--cyan-dim); }
      .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
      .chip.off { color: #3a4a5a; } .chip.off .dot { background: #3a4a5a; box-shadow: none; }

      /* main */
      .main { flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: 26px; min-height: 0; margin-top: 10px; }
      .stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4vh; }
      /* The status label + response text over the hologram are hidden — the
         conversation lives only in the transcript panel. */
      .state-label, .response { display: none; }

      /* side HUD panels */
      .side { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
      .panel {
        position: relative; background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 6px;
        padding: 14px 16px; backdrop-filter: blur(10px);
      }
      .panel::before, .panel::after {
        content: ""; position: absolute; width: 12px; height: 12px; border: 1px solid var(--cyan);
      }
      .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
      .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
      .panel h2 { margin: 0 0 10px; font: 10px/1 var(--mono); letter-spacing: 3px; text-transform: uppercase;
        color: var(--cyan); }
      .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; overflow: hidden;
        border: 1px solid var(--panel-brd); }
      .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .nowplaying { display: none; align-items: center; gap: 8px; font-weight: 600; color: var(--cyan-bright); font-size: 14px; }
      .nowplaying[data-on="1"] { display: flex; }
      .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; min-height: 0; }
      .log .entry { font-size: 13px; line-height: 1.45; }
      .log .you { color: var(--text-dim); } .log .jarvis { color: var(--cyan-bright); }
      .log b { font: 9px/1 var(--mono); letter-spacing: 2px; text-transform: uppercase; margin-right: 8px; opacity: .7; }

      /* command bar */
      .bar { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
      .bar input {
        flex: 1; padding: 15px 18px; font-size: 15px; color: var(--cyan-bright); font-family: var(--font);
        background: rgba(4, 14, 26, 0.6); border: 1px solid var(--panel-brd); border-radius: 5px; outline: none;
        transition: border-color .2s, box-shadow .2s;
      }
      .bar input::placeholder { color: #3f5a70; }
      .bar input:focus { border-color: var(--cyan); box-shadow: 0 0 20px var(--cyan-dim); }
      .bar.listening input { border-color: var(--cyan); animation: pulseBar 1.5s infinite; }
      @keyframes pulseBar {
        0% { box-shadow: 0 0 0 0 rgba(255,43,43,.45); } 70% { box-shadow: 0 0 0 14px rgba(255,43,43,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,43,43,0); }
      }
      .btn { padding: 14px 18px; font-size: 14px; font-family: var(--mono); letter-spacing: 1px; color: var(--cyan);
        background: var(--panel); border: 1px solid var(--cyan-dim); border-radius: 5px; cursor: pointer;
        text-transform: uppercase; transition: color .2s, box-shadow .2s, background .2s; }
      .btn:hover { color: var(--bg); background: var(--cyan); box-shadow: 0 0 22px var(--cyan); }
      .btn.stop { background: rgba(255,43,43,0.18); border-color: var(--cyan); color: var(--cyan-bright); font-weight: 700; }
      .stage { cursor: pointer; }
      /* Activation overlay — the single tap browsers require to unlock mic+audio */
      #activate {
        position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
        background: rgba(4, 1, 2, 0.82); backdrop-filter: blur(6px);
        cursor: pointer; transition: opacity .5s ease;
      }
      #activate.hide { opacity: 0; pointer-events: none; }
      #activate .ring-btn {
        width: 190px; height: 190px; border-radius: 50%;
        display: grid; place-items: center; text-align: center;
        border: 2px solid var(--cyan); color: var(--cyan-bright);
        font: 13px/1.6 var(--mono); letter-spacing: 3px; text-transform: uppercase;
        box-shadow: 0 0 44px var(--cyan-dim), inset 0 0 30px rgba(255,43,43,0.15);
        animation: actPulse 2s ease-in-out infinite;
      }
      @keyframes actPulse {
        0%,100% { transform: scale(1); box-shadow: 0 0 34px var(--cyan-dim); }
        50% { transform: scale(1.05); box-shadow: 0 0 60px var(--cyan); }
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 6px; }
      @media (max-width: 820px) {
        .app { padding: 14px 16px; }
        .wordmark { font-size: 15px; letter-spacing: 5px; }
        .subtitle { display: none; }
        .status { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .chip { padding: 7px 9px; font-size: 9px; }
        .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; gap: 12px; }
        .stage { padding-bottom: 1vh; min-height: 34vh; }
        .side { flex-direction: column; }
        .side .panel:first-child { display: none; } /* hide the video panel on phones */
        .side .panel:last-child { max-height: 30vh; }
        .bar input { font-size: 16px; } /* 16px avoids iOS zoom-on-focus */
      }
    </style>
  </head>
  <body>
    <canvas id="holo"></canvas>
    <div id="activate"><div class="ring-btn">Tap to<br />activate<br />JARVIS</div></div>
    <div class="fx"></div>
    <div class="hud"><span class="bl"></span><span class="br"></span></div>

    <div class="app">
      <div class="topbar">
        <div class="brand">
          <div class="wordmark">J.A.R.V.I.S.</div>
          <div class="subtitle">Just A Rather Very Intelligent System</div>
        </div>
        <div class="status">
          <span class="chip" id="conn"><span class="dot"></span> Online</span>
          <span class="chip" id="mic-toggle"><span class="dot"></span> Mic on</span>
          <span class="chip" id="speaker-toggle"><span class="dot"></span> Speaker on</span>
          <span class="chip" id="spotify-auth">Connect Spotify</span>
        </div>
      </div>

      <div class="main">
        <div class="stage" id="stage" data-state="idle">
          <div class="state-label" id="state-label">Standby</div>
          <div class="response" id="out">Initializing…</div>
        </div>
        <div class="side">
          <div class="panel">
            <h2>Now Playing</h2>
            <div class="nowplaying" id="nowplaying"></div>
            <div class="player" style="margin-top:10px">
              <iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>
          <div class="panel" style="flex:1; display:flex; flex-direction:column; min-height:0;">
            <h2>Transcript</h2>
            <div class="log" id="log"></div>
          </div>
        </div>
      </div>

      <div class="bar">
        <input id="utterance" placeholder="I'm always listening — just speak. Tap ⏹ or the hologram to cut me off." autofocus />
        <button class="btn stop" id="stop">⏹ Stop</button>
        <button class="btn" id="go">Send</button>
      </div>
    </div>

    <script>
      // Holographic core: rotating rings + a state-reactive projected waveform.
      (function () {
        const canvas = document.getElementById('holo');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        let W, H, cx, cy, R;
        function resize() {
          W = canvas.width = innerWidth * devicePixelRatio;
          H = canvas.height = innerHeight * devicePixelRatio;
          canvas.style.width = innerWidth + 'px';
          canvas.style.height = innerHeight + 'px';
          cx = W * 0.42; cy = H * 0.44; R = Math.min(W, H) * 0.17;
        }
        addEventListener('resize', resize); resize();

        const particles = Array.from({ length: 60 }, () => ({
          a: Math.random() * Math.PI * 2, r: R * (0.4 + Math.random() * 1.4),
          s: 0.2 + Math.random() * 0.8, z: Math.random(),
        }));

        // Galaxy backdrop: a deep starfield + drifting nebula clouds.
        const stars = Array.from({ length: 320 }, () => ({
          x: Math.random(), y: Math.random(),
          r: Math.random() * 1.5 + 0.25,
          tw: Math.random() * Math.PI * 2,
          sp: 0.4 + Math.random() * 2.2,
          warm: Math.random(),
        }));
        const nebula = [
          { x: 0.22, y: 0.28, r: 0.55, c: [150, 24, 60] },
          { x: 0.80, y: 0.22, r: 0.55, c: [70, 24, 130] },
          { x: 0.68, y: 0.82, r: 0.6, c: [170, 30, 44] },
          { x: 0.30, y: 0.78, r: 0.5, c: [34, 46, 130] },
        ];
        let drift = 0;

        function stateAmp(state, t) {
          if (state === 'speaking') return 1.0 + Math.sin(t * 9) * 0.5 + Math.sin(t * 17) * 0.25;
          if (state === 'listening') return 0.5 + Math.sin(t * 3) * 0.28;
          if (state === 'thinking') return 0.7 + (Math.random() - 0.5) * 0.9;
          return 0.32 + Math.sin(t * 1.4) * 0.14; // idle breathing
        }
        function color(state) {
          return state === 'thinking' ? [255, 154, 77] : [255, 43, 43];
        }

        let t = 0;
        let rot = 0;
        function frame() {
          t += 0.016;
          const state = stage.dataset.state || 'idle';
          const [cr, cg, cb] = color(state);
          const amp = stateAmp(state, t);
          const rgba = (a) => `rgba(${cr},${cg},${cb},${a})`;
          // Rotation speed reacts to state.
          rot += 0.005 + (state === 'speaking' ? 0.02 * Math.abs(Math.sin(t * 8)) : state === 'thinking' ? 0.03 : 0.003);
          ctx.clearRect(0, 0, W, H);

          // --- galaxy backdrop ---
          drift += 0.0004;
          for (const n of nebula) {
            const gx = (n.x + Math.sin(drift + n.y * 6) * 0.02) * W;
            const gy = (n.y + Math.cos(drift + n.x * 6) * 0.02) * H;
            const gr = n.r * Math.max(W, H) * 0.6;
            const ng = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
            ng.addColorStop(0, `rgba(${n.c[0]},${n.c[1]},${n.c[2]},0.16)`);
            ng.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = ng;
            ctx.fillRect(0, 0, W, H);
          }
          for (const s of stars) {
            const a = 0.35 + 0.65 * Math.abs(Math.sin(t * s.sp + s.tw));
            const g2 = 200 + Math.floor(s.warm * 55);
            const b2 = 210 + Math.floor((1 - s.warm) * 45);
            ctx.fillStyle = `rgba(255,${g2},${b2},${a})`;
            ctx.beginPath();
            ctx.arc(s.x * W, s.y * H, s.r * devicePixelRatio, 0, Math.PI * 2);
            ctx.fill();
          }

          // base projection glow
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 3.4);
          g.addColorStop(0, rgba(0.1));
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.lineCap = 'round';
          const Rp = R * (1 + 0.03 * (amp - 0.3)); // subtle breathing

          // emitter base + projection beams (the hologram is "projected" from below)
          const baseY = Rp * 1.95;
          ctx.save();
          for (let b = -1; b <= 1; b += 2) {
            const grd = ctx.createLinearGradient(0, baseY, b * Rp, 0);
            grd.addColorStop(0, rgba(0.32));
            grd.addColorStop(1, rgba(0));
            ctx.strokeStyle = grd;
            ctx.lineWidth = 1.4 * devicePixelRatio;
            ctx.beginPath();
            ctx.moveTo(0, baseY);
            ctx.lineTo(b * Rp, 0);
            ctx.stroke();
          }
          ctx.fillStyle = rgba(0.5);
          ctx.shadowBlur = 22; ctx.shadowColor = rgba(1);
          ctx.beginPath();
          ctx.ellipse(0, baseY, Rp * 0.55, Rp * 0.12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.shadowBlur = 14; ctx.shadowColor = rgba(0.9);
          ctx.lineWidth = 1.2 * devicePixelRatio;

          // sphere silhouette
          ctx.strokeStyle = rgba(0.45);
          ctx.beginPath();
          ctx.arc(0, 0, Rp, 0, Math.PI * 2);
          ctx.stroke();

          // latitude rings (perspective-flattened)
          for (let lat = -60; lat <= 60; lat += 30) {
            const la = (lat * Math.PI) / 180;
            const ry = Rp * Math.cos(la);
            const yy = Rp * Math.sin(la) * 0.95;
            ctx.strokeStyle = rgba(lat === 0 ? 0.7 : 0.38);
            ctx.beginPath();
            ctx.ellipse(0, yy, ry, ry * 0.28, 0, 0, Math.PI * 2);
            ctx.stroke();
          }

          // longitude meridians (rotating → the globe spins)
          const M = 6;
          for (let k = 0; k < M; k++) {
            const phase = rot + (k * Math.PI) / M;
            const rx = Math.abs(Rp * Math.cos(phase));
            ctx.strokeStyle = rgba(0.28 + 0.28 * Math.abs(Math.cos(phase)));
            ctx.beginPath();
            ctx.ellipse(0, 0, rx, Rp, 0, 0, Math.PI * 2);
            ctx.stroke();
          }

          // --- futuristic HUD: energy pulses, reticle, gyroscope rings, nodes ---
          // reactive energy pulses radiating from the core (stronger while speaking)
          for (let i = 0; i < 3; i++) {
            const ph = (t * (0.4 + (state === 'speaking' ? 0.9 : 0.15)) + i / 3) % 1;
            ctx.strokeStyle = rgba((1 - ph) * (state === 'speaking' ? 0.5 : 0.2));
            ctx.lineWidth = 1.2 * devicePixelRatio;
            ctx.beginPath(); ctx.arc(0, 0, Rp * (0.15 + ph), 0, Math.PI * 2); ctx.stroke();
          }

          // outer reticle: base ring + degree ticks + rotating corner brackets
          const Rr = Rp * 1.16;
          ctx.lineWidth = 1 * devicePixelRatio;
          ctx.strokeStyle = rgba(0.22);
          ctx.beginPath(); ctx.arc(0, 0, Rr, 0, Math.PI * 2); ctx.stroke();
          for (let i = 0; i < 72; i++) {
            const a = (i / 72) * Math.PI * 2 + rot * 0.3;
            const major = i % 6 === 0;
            const r1 = Rr - (major ? 11 : 5) * devicePixelRatio;
            ctx.strokeStyle = rgba(major ? 0.55 : 0.22);
            ctx.lineWidth = (major ? 1.5 : 0.8) * devicePixelRatio;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            ctx.lineTo(Math.cos(a) * Rr, Math.sin(a) * Rr);
            ctx.stroke();
          }
          ctx.strokeStyle = rgba(0.75); ctx.lineWidth = 2.2 * devicePixelRatio;
          ctx.shadowBlur = 10; ctx.shadowColor = rgba(0.9);
          for (let c = 0; c < 4; c++) {
            const a0 = -rot * 0.5 + (c * Math.PI) / 2;
            ctx.beginPath(); ctx.arc(0, 0, Rr + 6 * devicePixelRatio, a0 - 0.13, a0 + 0.13); ctx.stroke();
          }
          ctx.shadowBlur = 0;

          // gyroscope rings: three tilted rings tumbling at different rates, each
          // with a bright data node riding along it (depth-shaded for a 3D feel)
          const drawGyro = (tiltX, spin, rad, dashed) => {
            const N = 96, Rg = Rp * rad;
            const cA = Math.cos(tiltX), sA = Math.sin(tiltX);
            const cB = Math.cos(spin), sB = Math.sin(spin);
            let prev = null;
            for (let i = 0; i <= N; i++) {
              const a = (i / N) * Math.PI * 2;
              const x = Math.cos(a) * Rg, y = Math.sin(a) * Rg;
              const y1 = y * cA, z1 = y * sA;
              const x2 = x * cB + z1 * sB, z2 = -x * sB + z1 * cB;
              const depth = (z2 / Rg + 1) / 2;
              if (prev && !(dashed && i % 3 === 0)) {
                ctx.strokeStyle = rgba(0.1 + 0.42 * depth);
                ctx.lineWidth = (0.7 + 1.3 * depth) * devicePixelRatio;
                ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(x2, y1); ctx.stroke();
              }
              prev = { x: x2, y: y1 };
            }
            const na = rot * 2.2 + rad;
            const x = Math.cos(na) * Rg, y = Math.sin(na) * Rg;
            const y1 = y * cA, z1 = y * sA;
            const x2 = x * cB + z1 * sB;
            ctx.fillStyle = rgba(0.95); ctx.shadowBlur = 12; ctx.shadowColor = rgba(1);
            ctx.beginPath(); ctx.arc(x2, y1, 2.6 * devicePixelRatio, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
          };
          drawGyro(1.16, rot * 0.9, 1.30, true);
          drawGyro(0.55, -rot * 0.7 + 1, 1.16, false);
          drawGyro(1.45, rot * 1.2 + 2, 1.44, true);

          // vertical scan sweep across the sphere
          const sy = (((t * 0.5) % 1) * 2 - 1) * Rp;
          const halfw = Math.sqrt(Math.max(0, Rp * Rp - sy * sy));
          ctx.strokeStyle = rgba(0.85);
          ctx.lineWidth = 2 * devicePixelRatio;
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.moveTo(-halfw, sy);
          ctx.lineTo(halfw, sy);
          ctx.stroke();

          // soft inner glow (no solid orb — keep it see-through)
          const core = ctx.createRadialGradient(0, 0, 0, 0, 0, Rp * 0.75);
          core.addColorStop(0, rgba(0.22 + 0.16 * amp));
          core.addColorStop(1, rgba(0));
          ctx.fillStyle = core;
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(0, 0, Rp * 0.75, 0, Math.PI * 2);
          ctx.fill();

          // rising hologram particles
          ctx.shadowBlur = 8;
          for (const p of particles) {
            p.a += 0.002 * p.s;
            p.z += 0.003 * p.s;
            if (p.z > 1) p.z = 0;
            const rr = p.r * (0.7 + p.z * 0.6);
            const x = Math.cos(p.a) * rr;
            const y = Math.sin(p.a) * rr * 0.4 + Rp * 0.7 - p.z * Rp * 1.5;
            ctx.fillStyle = rgba((1 - p.z) * 0.5);
            ctx.beginPath();
            ctx.arc(x, y, 1.3 * devicePixelRatio, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
          requestAnimationFrame(frame);
        }
        frame();
      })();
    </script>
    <script src="renderer.js"></script>
  </body>
</html>
